name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Unit tests of ObserverCore.h (MSVC)
        shell: pwsh
        continue-on-error: true
        run: |
          cl /nologo /EHsc /W4 /std:c++14 tests\test_core.cpp /Fe:test_core.exe 2>&1 | Tee-Object -FilePath unit-tests.log
          .\test_core.exe 2>&1 | Tee-Object -FilePath unit-tests.log -Append

      - name: Clone Spore ModAPI SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/Spore-Community/Spore-ModAPI.git sdk

      - uses: microsoft/setup-msbuild@v2

      # The SDK's "Release" (static) configuration asks for toolset v145; the runner has VS 2022 (v143).
      - name: Build SDK static library (SporeModAPIBase.lib)
        id: sdkstatic
        continue-on-error: true
        shell: pwsh
        run: msbuild "sdk\Spore ModAPI\Spore ModAPI.vcxproj" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /v:minimal /flp:"logfile=sdk-static.log;verbosity=normal"

      # Same settings as the SDK's own CI (target BuildCombinedDll): EXECUTABLE_TYPE=10 selects addresses at runtime.
      - name: Build SDK DLL and import library (SporeModAPI.lib)
        id: sdkdll
        continue-on-error: true
        shell: pwsh
        run: msbuild "sdk\Spore ModAPI\Spore ModAPI.vcxproj" /p:Configuration="Release DLL" /p:Platform=Win32 /p:PlatformToolset=v143 /p:SDK_BUILD_VER=1 /p:EXECUTABLE_TYPE=10 /m /v:minimal /flp:"logfile=sdk-dll.log;verbosity=normal"

      - name: Prepare launcher layout and SdkPathConfig.props
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force launcher\coreLibs, launcher\mLibs | Out-Null
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <PropertyGroup Label="UserMacros">
              <SporeSdkPath>$(MSBuildThisFileDirectory)sdk\</SporeSdkPath>
              <SporeLauncherPath>$(MSBuildThisFileDirectory)launcher\</SporeLauncherPath>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 SdkPathConfig.props
          Copy-Item sdk\dll\Release\SporeModAPI.lib launcher\coreLibs\

      - name: Build TribalChiefObserver (Release|Win32)
        id: mod
        continue-on-error: true
        shell: pwsh
        run: msbuild TribalChiefObserver.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /v:minimal /flp:"logfile=mod.log;verbosity=normal"

      - name: Show produced DLL
        continue-on-error: true
        shell: pwsh
        run: Get-ChildItem launcher\mLibs | Format-Table Name, Length

      - name: Publish DLL as a pre-release asset
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ci-${{ github.run_number }}"
          Copy-Item launcher\mLibs\TribalChiefObserver.dll .
          gh release create $tag TribalChiefObserver.dll TribalChiefObserver.ini.example --prerelease `
            --title "TribalChiefObserver CI build ${{ github.run_number }}" `
            --notes "Prototype 0.1 (observer only). Built by CI from commit ${{ github.sha }} with MSVC. Not yet tested inside Spore."

      - name: Publish log excerpts to branch ci-logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logrepo | Out-Null
          foreach ($f in Get-ChildItem *.log) {
            $name = $f.BaseName
            Select-String -Path $f.FullName -Pattern 'error|fatal|LNK[0-9]+|warning C4' |
              Select-Object -First 400 | ForEach-Object { $_.Line.Trim() } | Set-Content "logrepo\$name.errors.txt" -Encoding utf8
            Get-Content $f.FullName -Tail 80 | Set-Content "logrepo\$name.tail.txt" -Encoding utf8
            if ($f.Length -lt 20MB) { Copy-Item $f.FullName "logrepo\$($f.Name)" }
          }
          Get-ChildItem sdk\lib, sdk\dll, launcher -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 250 | Set-Content logrepo\files.txt -Encoding utf8
          "steps: sdkstatic=${{ steps.sdkstatic.outcome }} sdkdll=${{ steps.sdkdll.outcome }} mod=${{ steps.mod.outcome }}" | Set-Content logrepo\outcome.txt
          Push-Location logrepo
          git init -b ci-logs
          git config user.name "ci"; git config user.email "ci@example.invalid"
          git add -A; git commit -m "logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TribalChiefObserver
          path: |
            launcher/mLibs/*.dll
            launcher/mLibs/*.pdb
            *.log
          if-no-files-found: warn
